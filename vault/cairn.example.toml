# A vault's cairn.toml, at its root and committed with it. /cairn:setup writes it.
# A folder is a cairn vault when it has this file.

# ---- Portable vault ----

owner = "Ada"

[cadence.daily]
enabled = true
minutes = 15            # 15 or more
slot = "weekdays 08:30" # default: first thing in the morning

[cadence.weekly]
enabled = true
minutes = 30            # 30 or 60
slot = "Fri 10:00"

[cadence.monthly]
enabled = true
minutes = 45            # 45 or 60
slot = "first Mon 10:00"

# ---- Company vault: this line only ----
# The company name lives only here, so it never enters the portable vault's history.

# company = "Acme"
