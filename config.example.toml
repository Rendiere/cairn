# cairn's machine config: what is true of this machine only. /cairn:setup writes it to
# ~/.config/cairn/config.toml ($CAIRN_CONFIG overrides). Never committed.
# Owner, employer and cadence live in the vault's cairn.toml; see vault/cairn.example.toml.

vault = "~/brain"

# A source not listed here is skipped by /cairn:sweep. {start} is replaced with the window's start date.
[sources.claude_code]
profiles = ["~/.claude"]

[sources.zoom_email]
query = 'from:no-reply@zoom.us subject:"Meeting assets" after:{start}'

[sources.meet_notes]
query = "name contains 'Notes' and mimeType = 'application/vnd.google-apps.document' and modifiedTime > '{start}T00:00:00Z'"

[sources.slack]
user_id = "U00000000"

# Present means enabled.
[sources.granola]

# Plain-text or markdown files modified in the window: Whisper transcripts, exported WhatsApp chats.
[sources.folders]
paths = ["~/transcripts"]

# An existing knowledge base. Read only: no skill ever writes here.
[sources.kb]
paths = ["~/Documents/Obsidian/Old notes"]
