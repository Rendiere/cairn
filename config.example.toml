# cairn's per-machine config. /cairn:setup writes it to ~/.config/cairn/config.toml ($CAIRN_CONFIG overrides).
# Every skill reads it first. A source not listed under [sources] is skipped by /cairn:sweep.

owner = "Ada"

[vaults]
portable = "~/brain"
# Present only when there is an employer. The company vault nests the portable one at general/.
company = "~/work/brain"
company_name = "Acme"

[cadence]
every = "weekly"          # daily | weekly | monthly
slot = "Fri 10:00"

[sources.claude_code]
profiles = ["~/.claude"]

[sources.zoom_email]
query = 'from:no-reply@zoom.us subject:"Meeting assets" after:{start}'

[sources.meet_notes]
query = "name contains 'Notes' and mimeType = 'application/vnd.google-apps.document' and modifiedTime > '{start}T00:00:00Z'"

[sources.slack]
user_id = "U00000000"

[sources.granola]
enabled = true

# Plain-text or markdown files modified in the window: Whisper transcripts, exported WhatsApp chats.
[sources.folders]
paths = ["~/transcripts"]

# An existing knowledge base. Read only: no skill ever writes here.
[sources.kb]
paths = ["~/Documents/Obsidian/Old notes"]
